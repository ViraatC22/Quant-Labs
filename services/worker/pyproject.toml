[project]
name = "quant-labs-worker"
version = "0.1.0"
description = "Background worker service for ingestion, embeddings, extraction, and backtests."
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0.0"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
